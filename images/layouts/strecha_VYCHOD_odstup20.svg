  <g font-size="11" fill="#123">
    <rect x="20" y="349.3" width="688" height="95" rx="6" fill="#f6f9ff" stroke="#1a5fb4"/>
    <text x="32" y="365.3">VYCHOD: 9 panelu. Rady zdola: 4n + 3n + 2n   (n = nalezato, s = nastojato).</text>
    <text x="32" y="380.3">Sestava je posunuta co nejvys - nahore odstup neni potreba, volne misto tak zbyva dole u okapu.</text>
    <text x="32" y="395.3">Skutecne odstupy: okap 39 cm (min. 20), nahore 1 cm, boky 20 cm kolmo k hrane.</text>
    <text x="32" y="410.3">Maximum pro tyto odstupy - hledano pres vsechny pozice rad po 1 cm i orientace rad.</text>
    <text x="32" y="425.3">POZOR: mensi odstup nez doporucenych 30 cm - overit s montazni firmou (vitr, odtok vody, pristup).</text>
