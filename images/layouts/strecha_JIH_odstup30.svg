    <text x="32" y="389.0">JIH: 9 panelu. Rady zdola: 4s + 3n + 2n   (n = nalezato, s = nastojato).</text>
    <text x="32" y="404.0">Sestava je posunuta co nejvys - nahore odstup neni potreba, volne misto tak zbyva dole u okapu.</text>
    <text x="32" y="419.0">Skutecne odstupy: okap 34 cm (min. 30), nahore 1 cm, boky 30 cm kolmo k hrane.</text>
