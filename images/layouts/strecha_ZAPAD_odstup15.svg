    <text x="32" y="408.8">ZAPAD: 10 panelu. Rady zdola: 4n + 3n + 3s   (n = nalezato, s = nastojato).</text>
    <text x="32" y="423.8">Sestava je posunuta co nejvys - nahore odstup neni potreba, volne misto tak zbyva dole u okapu.</text>
    <text x="32" y="438.8">Skutecne odstupy: okap 21 cm (min. 15), nahore 12 cm, boky 15 cm kolmo k hrane.</text>
