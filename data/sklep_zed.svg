<text x="105.0" y="842.8" font-size="13" fill="#2e7d32">MĚNIČ VYCHÁZÍ: nahoře 50 cm · dole 70 cm · vpravo volný prostor za koncem zdi · vlevo 26 cm ke stávající zóně</text>
<text x="105.0" y="862.8" font-size="13" fill="#c9382c">NEVEJDE SE: AC rozvaděč 72 DIN (59 × 62 cm) — po umístění měniče zbývá vlevo jen 26 cm šířky. Musí jinam.</text>
<text x="105.0" y="882.8" font-size="13" fill="#8a4b9c">Baterie na tuto zeď nepatří — 109 kg stojí na podlaze. Postavená bokem ke zdi zabere jen 23 cm šířky; RESACS Light je ležatá 44 × 26 cm.</text>
<text x="105.0" y="902.8" font-size="13" fill="#2e7d32">Cihlová zeď = třída reakce na oheň A1 → vyhláška 114/2023 Sb. §4b splněna bez nehořlavé podložky</text>
<text x="105.0" y="922.8" font-size="13" fill="#b26500">POZOR na odstup NAHOŘE: manuál neuvádí, kde má měnič sání a výdech. U chlazení ventilátorem stoupá teplý vzduch vzhůru — horní odstup je proto ten poslední, který obětovat.</text>
<text x="105.0" y="942.8" font-size="13" fill="#444">K OVĚŘENÍ: skutečný rozměr AC rozvaděče · manipulační prostor před rozvaděči dle ČSN · umístění baterie dál od kotle</text>
